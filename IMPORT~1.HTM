<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIM Inventory Import Report</title>
<style>
/* ============================================================ tokens ==== */
:root{
  --bg:#f4f6f9;
  --surface:#ffffff;
  --line:#e3e8ef;
  --line-soft:#eef1f6;
  --ink:#1a2233;
  --ink-2:#5b6779;
  --ink-3:#8a94a6;

  /* semantic colours lifted from the workbook's conditional formatting */
  --green-bg:#c6efce; --green-ink:#006100; --green-line:#a9e0b5;
  --amber-bg:#ffeb9c; --amber-ink:#9c5700; --amber-line:#f0d47c;
  --red-bg:#ffc7ce;   --red-ink:#9c0006;   --red-line:#f3adb6;
  --blue-bg:#dbe9f8;  --blue-ink:#1f4e79;  --blue-line:#bcd6f0;
  --grey-bg:#e9edf3;  --grey-ink:#5b6779;  --grey-line:#d8dee7;

  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:28px 20px 64px;
}
.wrap{max-width:1400px;margin:0 auto}

/* ============================================================ header ==== */
.head{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px 26px;margin-bottom:18px;
  display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:space-between;
}
.head h1{margin:0 0 4px;font-size:21px;font-weight:650;letter-spacing:-.2px}
.head .sub{color:var(--ink-3);font-size:13.5px}
.verdict{
  display:inline-flex;align-items:center;gap:9px;
  padding:9px 16px;border-radius:999px;font-weight:650;font-size:14px;
  border:1px solid transparent;white-space:nowrap;
}
.verdict .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.verdict.ok  {background:var(--green-bg);color:var(--green-ink);border-color:var(--green-line)}
.verdict.warn{background:var(--amber-bg);color:var(--amber-ink);border-color:var(--amber-line)}
.verdict.bad {background:var(--red-bg);  color:var(--red-ink);  border-color:var(--red-line)}

.meta{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));
  gap:2px 26px;width:100%;border-top:1px solid var(--line-soft);padding-top:18px;margin-top:4px;
}
.meta div{padding:5px 0}
.meta dt{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);font-weight:600}
.meta dd{margin:2px 0 0;font-size:13.5px;font-variant-numeric:tabular-nums;word-break:break-word}
.meta dd a{color:var(--blue-ink);text-decoration:none;border-bottom:1px solid var(--blue-line)}
.meta dd a:hover{border-bottom-color:var(--blue-ink)}

/* ============================================================== kpis ==== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:18px}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
}
.kpi:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 14px 28px -14px rgba(16,24,40,.26)}
.kpi[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,var(--grey-line))}
.kpi .n{font-size:28px;font-weight:680;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:3px}
.kpi.total  {--accent:#96a2b5}
.kpi.created{--accent:var(--green-ink)} .kpi.created .n{color:var(--green-ink)}
.kpi.updated{--accent:var(--blue-ink)}  .kpi.updated .n{color:var(--blue-ink)}
.kpi.warning{--accent:var(--amber-ink)} .kpi.warning .n{color:var(--amber-ink)}
.kpi.skipped{--accent:var(--grey-ink)}  .kpi.skipped .n{color:var(--grey-ink)}
.kpi.failed {--accent:var(--red-ink)}   .kpi.failed  .n{color:var(--red-ink)}

/* ============================================================== bar ===== */
.compo{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
.compo .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:9px}
.bar{display:flex;height:11px;border-radius:999px;overflow:hidden;background:var(--line-soft)}
.bar span{display:block;transition:width .3s ease}
.bar .s-created{background:#4caf72}
.bar .s-updated{background:#3d7ebd}
.bar .s-warning{background:#e0a63a}
.bar .s-skipped{background:#aab4c4}
.bar .s-failed {background:#d4626f}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}

/* =========================================================== toolbar ==== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.search{position:relative;flex:1 1 260px;min-width:220px}
.search input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--radius-sm);
  font-size:14px;font-family:inherit;background:#fbfcfe;color:var(--ink);
}
.search input:focus{outline:2px solid var(--blue-line);outline-offset:-1px;background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--line);background:#fbfcfe;color:var(--ink-2);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:560;cursor:pointer;
  font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.12s;
}
.chip:hover{border-color:#c9d2de}
.chip .c{font-variant-numeric:tabular-nums;opacity:.6;font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip[aria-pressed="true"] .c{opacity:.75}
.spacer{flex:1 1 auto}
.btn{
  border:1px solid var(--line);background:#fbfcfe;color:var(--ink-2);padding:8px 14px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
}
.btn:hover{border-color:#c9d2de;color:var(--ink)}

/* ============================================================= table ==== */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{
  position:sticky;top:0;z-index:2;background:#f7f9fc;text-align:left;
  padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
thead th .arw{opacity:.32;font-size:10px;margin-left:3px}
thead th[data-dir="asc"] .arw,thead th[data-dir="desc"] .arw{opacity:1;color:var(--ink)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover{background:#fafbfd}
tbody tr.r-failed  td{background:#fff6f7}
tbody tr.r-failed:hover td{background:#ffeff1}
tbody tr.r-warning td{background:#fffdf4}
tbody tr.r-warning:hover td{background:#fffaea}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.dim{color:var(--ink-3)}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  font-size:12px;font-weight:650;border:1px solid transparent;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-created{background:var(--green-bg);color:var(--green-ink);border-color:var(--green-line)}
.p-updated{background:var(--blue-bg); color:var(--blue-ink); border-color:var(--blue-line)}
.p-warning{background:var(--amber-bg);color:var(--amber-ink);border-color:var(--amber-line)}
.p-skipped{background:var(--grey-bg); color:var(--grey-ink); border-color:var(--grey-line)}
.p-failed {background:var(--red-bg);  color:var(--red-ink);  border-color:var(--red-line)}

.msg{max-width:430px;line-height:1.45}
.msg .em{color:var(--red-ink);font-weight:600}
.chg{margin:5px 0 0;padding:0;list-style:none;font-size:12.5px}
.chg li{padding:2px 0;color:var(--ink-2)}
.chg b{font-weight:620;color:var(--ink)}
.chg .from{color:var(--ink-3);text-decoration:line-through;text-decoration-color:#c9d2de}
.chg .to{color:var(--green-ink);font-weight:600}
.chg .arrow{color:var(--ink-3);margin:0 5px}

.empty{padding:56px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:5px}

.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
  padding:13px 18px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-3)}

/* ======================================================== responsive ==== */
@media (max-width:860px){
  body{padding:16px 12px 48px}
  .head{padding:18px}
  thead{display:none}
  tbody tr{display:block;border-bottom:8px solid var(--bg);background:#fff}
  tbody td{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;
    padding:8px 14px;border-bottom:1px solid var(--line-soft)}
  tbody td::before{content:attr(data-label);flex:none;font-size:11px;text-transform:uppercase;
    letter-spacing:.6px;color:var(--ink-3);font-weight:700;padding-top:2px}
  tbody td:last-child{border-bottom:none}
  .msg{max-width:none;text-align:right}
  .num{text-align:right}
}

/* ============================================================= print ==== */
@media print{
  body{background:#fff;padding:0}
  .toolbar,.kpi:hover{display:none}
  .panel,.head,.kpi,.compo{box-shadow:none;border-color:#d0d7e2;break-inside:avoid}
  tbody tr{break-inside:avoid}
  thead th{position:static}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================================================== header ===== -->
  <header class="head">
    <div>
      <h1 id="title">SIM Inventory — Import Report</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>

  </header>

  <!-- ======================================================= kpis ===== -->
  <section class="kpis" id="kpis"></section>

  <!-- ================================================= composition ==== -->
  <section class="compo">
    <div class="cap"><span>Outcome composition</span><span id="compoTotal"></span></div>
    <div class="bar" id="bar"></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- ====================================================== table ===== -->
  <section class="panel">
    <div class="toolbar">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
        </svg>
        <input id="q" type="search" placeholder="Search ICC_ID, phone, name, SharePoint ID, message…"
               autocomplete="off" aria-label="Search rows">
      </label>

      <span class="spacer"></span>
      <button class="btn" id="csv" type="button">Export CSV</button>
      <button class="btn" id="print" type="button">Print</button>
    </div>

    <div class="scroll">
      <table id="tbl">
        <thead>
          <tr>
            <th class="sortable" data-k="excelRow">Excel row <span class="arw">▲</span></th>
            <th class="sortable" data-k="action">Action <span class="arw">▲</span></th>

            <th class="sortable" data-k="spId">SP&nbsp;ID <span class="arw">▲</span></th>
            <th class="sortable" data-k="matchedOn">Matched on <span class="arw">▲</span></th>
            <th>Outcome</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
      <div class="empty" id="empty" hidden>
        <b>No rows match these filters</b>
        Try clearing the search box or re-enabling a status chip.
      </div>
    </div>

    <div class="foot">
      <span id="count"></span>
      <span id="stamp"></span>
    </div>
  </section>
</div>

<script>
/* ======================================================================
   DATA INJECTION POINT
   ----------------------------------------------------------------------
   The next statement assigns the report data. In the production copy the
   mock object is replaced by a single placeholder token, so the line reads:

       const REPORT = <TOKEN>;

   The token is spelled with two leading and two trailing underscores around
   the words REPORT and JSON. It is written out only once in this file, on
   that line and nowhere else - deliberately, because Power Automate's
   replace() substitutes EVERY match. If the token appeared in this comment
   too, the whole report JSON would be injected here as well.

   In the flow, after Get file content on this template:

       replace(base64ToString(body('Get_report_template')?['$content']),
               '<TOKEN>', string(outputs('Compose_report_json')))

   Compose_report_json must produce { meta: {...}, rows: [...] }.
   ====================================================================== */
const REPORT = {

     simCountry:"Romania", spId:1043, matchedOn:"ICC_ID + PhoneNr",
     message:"Item updated.",

    {excelRow:4, action:"created", name:"Elena Dumitru", iccId:"8935201234567890992", phoneNr:"+40745998877",
     simCountry:"Romania", spId:1301, matchedOn:"—",
     message:"No match on ICC_ID + PhoneNr. New list item created.", changes:[]},

    {excelRow:5, action:"created", name:"Radu Constantin", iccId:"8935201234567891008", phoneNr:"+40722114455",
     simCountry:"Romania", spId:1302, matchedOn:"—",
     message:"No match on ICC_ID + PhoneNr. New list item created.", changes:[]},

    {excelRow:6, action:"warning", name:"Ioana Marin", iccId:"8935201234567890430", phoneNr:"+40733004455",
     simCountry:"Romania", spId:1055, matchedOn:"ICC_ID + PhoneNr",
     message:"Updated, but ICC_ID failed its Luhn check digit — likely a typo or transposition. Verify against the physical SIM.",
     changes:[{field:"SIM Type",from:"Physical SIM",to:"eSIM"}]},

    {excelRow:7, action:"warning", name:"Gabriel Stan", iccId:"8935201234567890877", phoneNr:"+40799001122",

     message:"Updated. StartDate 15-03-2029 is more than 2 years ahead — check the day/month order.",
     changes:[{field:"StartDate",from:"15-03-2026",to:"15-03-2029"}]},

    {excelRow:8, action:"skipped", name:"Lukas Müller", iccId:"893520123456789012345", phoneNr:"+4915112345678",

       {field:"BAN",from:"883001",to:"901447"},{field:"Status",from:"Active",to:"Deactivated"}]},

    {excelRow:16, action:"updated", name:"Sorin Barbu", iccId:"8935201234567890183", phoneNr:"+40766554433",

};

/* ---------------------------------------------------------------- setup */
const ORDER  = ["created","updated","warning","skipped","failed"];
const LABEL  = {created:"Created",updated:"Updated",warning:"Warning",skipped:"Skipped",failed:"Failed"};
const rows   = REPORT.rows || [];
const active = new Set(ORDER);
let sortKey = "excelRow", sortDir = 1;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const count = a => rows.filter(r => r.action === a).length;

function fmt(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined,
    {year:"numeric",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function dur(a,b){
  const s = Math.max(0, Math.round((new Date(b) - new Date(a))/1000));
  return isNaN(s) ? "—" : (s < 60 ? s+"s" : Math.floor(s/60)+"m "+(s%60)+"s");
}

/* --------------------------------------------------------------- header */
(function header(){
  const m = REPORT.meta || {};
  document.getElementById("subtitle").textContent =
    `${m.listName || "SharePoint list"} · scoped to ${m.country || "—"} · ${rows.length} rows in file`;

  const failed = count("failed"), warned = count("warning");
  const v = document.getElementById("verdict"), t = document.getElementById("verdictText");
  if(failed){ v.className = "verdict bad";  t.textContent = `${failed} row${failed>1?"s":""} rejected`; }
  else if(warned){ v.className = "verdict warn"; t.textContent = `Completed with ${warned} warning${warned>1?"s":""}`; }
  else { v.className = "verdict ok"; t.textContent = "Completed cleanly"; }

  // [label, value, href?] - a third element renders the value as a link
  const entries = [
    ["Source file", m.fileName],
    ["Country scope", m.country],
    ["Target list", m.listName],
    ["Started", fmt(m.startedUtc)],
    ["Duration", dur(m.startedUtc, m.finishedUtc)],
    ["Run by", m.operator],
    ["Validation gate", m.gate],
    ["Run ID", m.runId]
  ];
  // Optional. Lets whoever reads the report jump straight to the run history,
  // which is the first thing anyone wants when a row failed.
  if(m.flowUrl){ entries.push(["Flow run", m.flowName || "Open in Power Automate", m.flowUrl]); }
  if(m.reportUrl){ entries.push(["This report", "Open saved copy", m.reportUrl]); }

  document.getElementById("meta").innerHTML = entries.map(([k,val,href]) =>
    `<div><dt>${esc(k)}</dt><dd>${
      href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(val || "Open")}</a>`
           : esc(val || "—")
    }</dd></div>`).join("");
})();

/* ----------------------------------------------------------------- kpis */
(function kpis(){
  const cards = [["total","Rows in file",rows.length]]
    .concat(ORDER.map(a => [a, LABEL[a], count(a)]));
  document.getElementById("kpis").innerHTML = cards.map(([k,l,n]) =>
    `<button class="kpi ${k}" type="button" data-a="${k}" aria-pressed="false">
       <div class="n">${n}</div><div class="l">${esc(l)}</div></button>`).join("");

  document.getElementById("kpis").addEventListener("click", e => {
    const b = e.target.closest(".kpi"); if(!b) return;
    const a = b.dataset.a;
    if(a === "total"){ ORDER.forEach(x => active.add(x)); }
    else { active.clear(); active.add(a); }        // click a card = isolate it
    sync();
  });
})();

/* ---------------------------------------------------------- composition */
(function compo(){
  const t = rows.length || 1;
  document.getElementById("compoTotal").textContent = `${rows.length} rows`;
  document.getElementById("bar").innerHTML = ORDER.map(a =>
    `<span class="s-${a}" style="width:${count(a)/t*100}%" title="${LABEL[a]}: ${count(a)}"></span>`).join("");
  document.getElementById("legend").innerHTML = ORDER.map(a =>
    `<span><i class="s-${a}" style="background:${
      {created:"#4caf72",updated:"#3d7ebd",warning:"#e0a63a",skipped:"#aab4c4",failed:"#d4626f"}[a]
    }"></i>${LABEL[a]} · ${count(a)}</span>`).join("");
})();

/* ---------------------------------------------------------------- chips */
document.getElementById("chips").innerHTML = ORDER.map(a =>
  `<button class="chip" type="button" data-a="${a}" aria-pressed="true">
     ${LABEL[a]} <span class="c">${count(a)}</span></button>`).join("");

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  const a = b.dataset.a;
  active.has(a) ? active.delete(a) : active.add(a);
  if(!active.size) ORDER.forEach(x => active.add(x));   // never filter to nothing
  sync();
});

/* --------------------------------------------------------------- sorting */
document.querySelectorAll("th.sortable").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    sortDir = (k === sortKey) ? -sortDir : 1;
    sortKey = k;
    document.querySelectorAll("th.sortable").forEach(o => o.removeAttribute("data-dir"));
    th.dataset.dir = sortDir > 0 ? "asc" : "desc";
    th.querySelector(".arw").textContent = sortDir > 0 ? "▲" : "▼";
    sync();
  });
});

/* -------------------------------------------------------------- filtering */
function visible(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  return rows
    .filter(r => active.has(r.action))
    .filter(r => !q || [r.name,r.iccId,r.phoneNr,r.spId,r.message,r.simCountry,r.matchedOn]
      .some(v => String(v ?? "").toLowerCase().includes(q)))
    .sort((a,b) => {
      let x = a[sortKey], y = b[sortKey];
      if(x == null) x = ""; if(y == null) y = "";
      if(typeof x === "number" && typeof y === "number") return (x-y)*sortDir;
      return String(x).localeCompare(String(y), undefined, {numeric:true}) * sortDir;
    });
}

function render(list){
  document.getElementById("tb").innerHTML = list.map(r => {
    const chg = (r.changes && r.changes.length)
      ? `<ul class="chg">${r.changes.map(c =>
          `<li><b>${esc(c.field)}</b>: <span class="from">${esc(c.from)}</span>
           <span class="arrow">→</span><span class="to">${esc(c.to)}</span></li>`).join("")}</ul>`
      : "";
    return `<tr class="r-${r.action}">
      <td class="num" data-label="Excel row">${esc(r.excelRow)}</td>
      <td data-label="Action"><span class="pill p-${r.action}"><span class="dot"></span>${LABEL[r.action]}</span></td>
      <td data-label="Employee">${esc(r.name)}</td>
      <td class="mono" data-label="ICC_ID">${esc(r.iccId)}</td>
      <td class="mono" data-label="PhoneNr">${esc(r.phoneNr)}</td>
      <td data-label="Country">${esc(r.simCountry)}</td>
      <td class="mono ${r.spId ? "" : "dim"}" data-label="SP ID">${r.spId ?? "—"}</td>
      <td class="dim" data-label="Matched on">${esc(r.matchedOn)}</td>
      <td class="msg" data-label="Outcome">${esc(r.message)}${chg}</td>
    </tr>`;
  }).join("");

  document.getElementById("empty").hidden = list.length > 0;
  document.getElementById("count").textContent =
    `Showing ${list.length} of ${rows.length} rows`;
}

function sync(){
  document.querySelectorAll(".chip").forEach(c =>
    c.setAttribute("aria-pressed", active.has(c.dataset.a)));
  document.querySelectorAll(".kpi").forEach(c =>
    c.setAttribute("aria-pressed",
      c.dataset.a !== "total" && active.size === 1 && active.has(c.dataset.a)));
  render(visible());
}

document.getElementById("q").addEventListener("input", sync);

/* ----------------------------------------------------------------- export */
document.getElementById("csv").addEventListener("click", () => {
  const head = ["Excel row","Action","Employee","ICC_ID","PhoneNr","Country","SP ID","Matched on","Outcome","Changes"];
  const q = s => `"${String(s ?? "").replace(/"/g,'""')}"`;
  const body = visible().map(r => [
    r.excelRow, LABEL[r.action], r.name, r.iccId, r.phoneNr, r.simCountry,
    r.spId ?? "", r.matchedOn, r.message,
    (r.changes || []).map(c => `${c.field}: ${c.from} -> ${c.to}`).join("; ")
  ].map(q).join(","));
  // BOM so Excel opens UTF-8 correctly, and ICC_IDs stay readable
  const blob = new Blob(["﻿" + [head.map(q).join(","), ...body].join("\r\n")],
    {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (REPORT.meta.fileName || "import_report").replace(/\.xlsx$/i,"") + "_report.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById("print").addEventListener("click", () => window.print());

document.getElementById("stamp").textContent = "Generated " + fmt(new Date().toISOString());
sync();
</script>
</body>
</html>
